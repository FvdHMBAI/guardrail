server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/mime.types;
    types { text/vtt vtt; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://stats.golfclub-app.de; connect-src 'self' https://stats.golfclub-app.de; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # Caching
    location ~* \.(html)$ {
        expires 1h;
    }

    # Gzip
    gzip on;
    gzip_types text/css application/json;
    gzip_min_length 256;
}
