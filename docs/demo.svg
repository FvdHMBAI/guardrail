<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="'SF Mono','Fira Code','Cascadia Code',Consolas,monospace" font-size="13">
  <style>
    .bg { fill: #0d1117; }
    .bar { fill: #161b22; }
    .dot-r { fill: #ff5f57; }
    .dot-y { fill: #febc2e; }
    .dot-g { fill: #28c840; }
    .title { fill: #8b949e; font-size: 12px; }
    .prompt { fill: #6e7681; }
    .cmd { fill: #e6edf3; }
    .blocked { fill: #f85149; font-weight: bold; }
    .ok { fill: #3fb950; font-weight: bold; }
    .msg { fill: #8b949e; font-size: 12px; }
    .install { fill: #58a6ff; }
    .dim { fill: #484f58; }
    .cursor { fill: #e6edf3; }

    @keyframes t1 { 0%,8% { opacity:0 } 10% { opacity:1 } }
    @keyframes t2 { 0%,18% { opacity:0 } 20% { opacity:1 } }
    @keyframes t3 { 0%,23% { opacity:0 } 25% { opacity:1 } }
    @keyframes t4 { 0%,33% { opacity:0 } 35% { opacity:1 } }
    @keyframes t5 { 0%,38% { opacity:0 } 40% { opacity:1 } }
    @keyframes t6 { 0%,48% { opacity:0 } 50% { opacity:1 } }
    @keyframes t7 { 0%,53% { opacity:0 } 55% { opacity:1 } }
    @keyframes t8 { 0%,63% { opacity:0 } 65% { opacity:1 } }
    @keyframes t9 { 0%,68% { opacity:0 } 70% { opacity:1 } }
    @keyframes t10 { 0%,78% { opacity:0 } 80% { opacity:1 } }
    @keyframes t11 { 0%,83% { opacity:0 } 85% { opacity:1 } }
    @keyframes blink { 0%,49% { opacity:1 } 50%,100% { opacity:0 } }

    .l1 { opacity:0; animation: t1 12s infinite; }
    .l2 { opacity:0; animation: t2 12s infinite; }
    .l3 { opacity:0; animation: t3 12s infinite; }
    .l4 { opacity:0; animation: t4 12s infinite; }
    .l5 { opacity:0; animation: t5 12s infinite; }
    .l6 { opacity:0; animation: t6 12s infinite; }
    .l7 { opacity:0; animation: t7 12s infinite; }
    .l8 { opacity:0; animation: t8 12s infinite; }
    .l9 { opacity:0; animation: t9 12s infinite; }
    .l10 { opacity:0; animation: t10 12s infinite; }
    .l11 { opacity:0; animation: t11 12s infinite; }
  </style>

  <!-- Window -->
  <rect class="bg" width="720" height="400" rx="8"/>
  <rect class="bar" width="720" height="32" rx="8 8 0 0"/>
  <circle class="dot-r" cx="20" cy="16" r="6"/>
  <circle class="dot-y" cx="40" cy="16" r="6"/>
  <circle class="dot-g" cx="60" cy="16" r="6"/>
  <text class="title" x="360" y="20" text-anchor="middle">guardrail</text>

  <!-- Line 1: npx guardrail-agent init -->
  <g class="l1">
    <text class="prompt" x="20" y="64">$</text>
    <text class="cmd" x="36" y="64">npx guardrail-agent init</text>
  </g>

  <!-- Line 2: installed -->
  <g class="l2">
    <text class="ok" x="36" y="86">+</text>
    <text class="msg" x="52" y="86">Installed 10 core guards</text>
  </g>

  <!-- Line 3: configured -->
  <g class="l3">
    <text class="ok" x="36" y="106">+</text>
    <text class="msg" x="52" y="106">Configured Claude Code hooks</text>
  </g>

  <!-- Line 4: rm -rf -->
  <g class="l4">
    <text class="prompt" x="20" y="142">$</text>
    <text class="cmd" x="36" y="142">rm -rf /home/developer</text>
  </g>

  <!-- Line 5: BLOCKED -->
  <g class="l5">
    <text class="blocked" x="36" y="164">x BLOCKED</text>
    <text class="msg" x="130" y="164">Recursive delete on protected path.</text>
  </g>

  <!-- Line 6: git push -->
  <g class="l6">
    <text class="prompt" x="20" y="200">$</text>
    <text class="cmd" x="36" y="200">git push --force origin main</text>
  </g>

  <!-- Line 7: BLOCKED -->
  <g class="l7">
    <text class="blocked" x="36" y="222">x BLOCKED</text>
    <text class="msg" x="130" y="222">Force push to protected branch.</text>
  </g>

  <!-- Line 8: env -->
  <g class="l8">
    <text class="prompt" x="20" y="258">$</text>
    <text class="cmd" x="36" y="258">env</text>
  </g>

  <!-- Line 9: BLOCKED -->
  <g class="l9">
    <text class="blocked" x="36" y="280">x BLOCKED</text>
    <text class="msg" x="130" y="280">Exposes all environment variables.</text>
  </g>

  <!-- Line 10: npm install -->
  <g class="l10">
    <text class="prompt" x="20" y="316">$</text>
    <text class="cmd" x="36" y="316">npm install express</text>
  </g>

  <!-- Line 11: OK -->
  <g class="l11">
    <text class="ok" x="36" y="338">+ OK</text>
  </g>

  <!-- Blinking cursor -->
  <g class="l11">
    <rect class="cursor" x="20" y="356" width="8" height="16" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0;0.7" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
