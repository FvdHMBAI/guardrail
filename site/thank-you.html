<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Thank you — GuardRail</title>
  <meta name="robots" content="noindex">
  <style>
    :root {
      --ground: #FAF8F5;
      --ink: #2D2A26;
      --ink-dim: #6B6560;
      --accent: #D64933;
      --green: #16A34A;
      --code-bg: #1E293B;
      --code-text: #E2E8F0;
      --mono: 'SF Mono', 'Cascadia Code', 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
      --body: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      --display: 'Arial Narrow', 'Helvetica Neue', Impact, system-ui, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--body);
      background: var(--ground);
      color: var(--ink);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      max-width: 560px;
      padding: 3rem 2rem;
      text-align: center;
    }
    .check {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: var(--green);
      color: #fff;
      font-size: 2rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-family: var(--display);
      font-size: 2rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }
    p {
      color: var(--ink-dim);
      font-size: 1rem;
      margin-bottom: 1.5rem;
      line-height: 1.7;
    }
    .next-step {
      background: var(--code-bg);
      color: var(--code-text);
      font-family: var(--mono);
      font-size: 0.9rem;
      padding: 0.8rem 1.2rem;
      border-radius: 6px;
      display: inline-block;
      margin-bottom: 1.5rem;
    }
    .help {
      font-size: 0.85rem;
      color: var(--ink-dim);
    }
    .help a { color: var(--accent); text-decoration: none; }
    .help a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="check">&#10003;</div>
    <h1>Purchase confirmed</h1>
    <p>Your AI Governance Starter Kit is on its way. You will receive a download link at your email address within a few minutes.</p>
    <p>While you wait, install GuardRail and activate your guards:</p>
    <div class="next-step">$ npx guardrail-agent init</div>
    <p class="help">Questions? Email <a href="mailto:frederik@frederikvonderheyden.de">frederik@frederikvonderheyden.de</a></p>
  </div>
</body>
</html>
